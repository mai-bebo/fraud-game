<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عين المحقق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: case-file desk. Evidence (the suspicious screen) on one side, the investigator's notebook on the other; caution-tape stripe is the single bold motif. */
:root{
  --desk:#E4E9EE;
  --sheet:#FFFFFF;
  --tint:#F2F5F8;
  --ink:#13213A;
  --muted:#56667B;
  --line:#CBD4DE;
  --signal:#E9A514;
  --signal-ink:#3A2700;
  --alarm:#C93A33;
  --safe:#167F57;
  --stripe:#13213A;
  --shadow:0 22px 48px -24px rgba(19,33,58,.45);
  --display:"Lalezar","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#0E1826; --sheet:#16233A; --tint:#122034; --ink:#E5ECF4; --muted:#93A3B8;
    --line:#2A3B55; --signal:#F2B23A; --signal-ink:#2B1C00; --alarm:#F0665E; --safe:#3DC08A;
    --stripe:#0A111C; --shadow:0 22px 48px -24px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0E1826; --sheet:#16233A; --tint:#122034; --ink:#E5ECF4; --muted:#93A3B8;
  --line:#2A3B55; --signal:#F2B23A; --signal-ink:#2B1C00; --alarm:#F0665E; --safe:#3DC08A;
  --stripe:#0A111C; --shadow:0 22px 48px -24px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
#app{direction:rtl}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--signal) 0 16px,var(--stripe) 16px 32px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.55rem;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:34px;height:34px}
.hud{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
.iconbtn{cursor:pointer}
.score-pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.15)}}

.progress{display:grid;grid-template-columns:repeat(var(--n,9),1fr);gap:6px;margin-block:14px 24px}
.seg{height:7px;border-radius:4px;background:var(--line)}
.seg.cur{background:var(--ink)}
.seg.good{background:var(--safe)}
.seg.mid{background:var(--signal)}
.seg.bad{background:var(--alarm)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:600;font-size:1rem;border-radius:12px;padding:12px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.big{font-size:1.15rem;padding:15px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:28px 12px}
.eyebrow{font-size:.9rem;font-weight:600;color:var(--muted)}
.hero h1{font-size:clamp(3.2rem,9vw,6.4rem);line-height:1.05;margin-block:6px 14px}
.hero h1 span{color:var(--signal)}
.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-block:30px}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.step .n{font-family:var(--display);font-size:1.7rem;color:var(--signal);line-height:1}
.step h3{font-size:1.25rem;margin-block:6px 4px}
.step p{font-size:.92rem;color:var(--muted)}
.meta{color:var(--muted);font-size:.92rem}
.hero-art{max-width:420px;width:100%;justify-self:center}
.hero-art svg{width:100%;height:auto;display:block}

/* case */
.case{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:28px;align-items:start}
.ctx{display:grid;gap:6px;margin-bottom:16px}
.ctx h2{font-size:clamp(1.9rem,4vw,2.6rem)}
.ctx p{color:var(--muted);max-width:40em}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;color:var(--muted)}
.tag i{font-style:normal;background:var(--ink);color:var(--sheet);border-radius:6px;padding:1px 9px}
.evidence{position:relative;background:var(--tint);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,32px);display:grid;place-items:center;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.evidence.scan .device{cursor:crosshair}
.scanhint{position:absolute;top:12px;inset-inline-start:14px;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.missx{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2.5px solid var(--alarm);color:var(--alarm);display:grid;place-items:center;font-weight:700;background:var(--sheet);pointer-events:none;animation:fadeout 1.4s ease forwards;z-index:5}
@keyframes fadeout{0%{transform:scale(.4)}20%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.float{position:absolute;font-weight:700;pointer-events:none;animation:rise 1s ease forwards;z-index:6;font-variant-numeric:tabular-nums}
.float.plus{color:var(--safe)} .float.minus{color:var(--alarm)}
@keyframes rise{to{transform:translateY(-38px);opacity:0}}

/* hotspot states (inside the device mockup) */
.hs{border-radius:4px;transition:background .2s ease;position:relative}
.hs.found{background:rgba(233,165,20,.28);box-shadow:0 0 0 2.5px #E9A514}
.hs.missed{box-shadow:0 0 0 2.5px #C93A33;background:rgba(201,58,51,.12)}
.hs[data-n]::after{content:attr(data-n);position:absolute;top:-11px;inset-inline-end:-10px;width:20px;height:20px;border-radius:50%;background:#E9A514;color:#2B1C00;font:700 11px/20px "Readex Pro",sans-serif;text-align:center;z-index:2;box-shadow:0 0 0 2px #fff}
.hs.missed[data-n]::after{background:#C93A33;color:#fff}
.hs.hint{animation:hint 1.6s ease 2}
@keyframes hint{50%{background:rgba(233,165,20,.45);box-shadow:0 0 0 6px rgba(233,165,20,.35)}}

/* notebook */
.note{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.note-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.note-head h3{font-size:1.5rem}
.count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.flags{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.flags li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;animation:slidein .35s ease}
@keyframes slidein{from{transform:translateY(6px)}}
.pin{width:26px;height:26px;border-radius:50%;background:var(--signal);color:var(--signal-ink);font-weight:700;font-size:.85rem;display:grid;place-items:center;margin-top:2px}
.flags li.missed .pin{background:var(--alarm);color:#fff}
.flags b{display:block;font-weight:600}
.flags small{display:block;color:var(--muted);font-size:.9rem;line-height:1.6}
.flags .lbl{font-size:.75rem;font-weight:700;color:var(--alarm);margin-inline-start:6px}
.empty{color:var(--muted);font-size:.95rem;border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.rule{height:1px;background:var(--line)}
.q{font-family:var(--display);font-size:1.45rem}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:start;cursor:pointer;padding:14px 16px;border:2px solid var(--line);background:var(--sheet);border-radius:12px;font-size:1rem;line-height:1.6;transition:border-color .15s ease,transform .15s ease}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(-3px)}
.opt:disabled{cursor:default}
.opt.best{border-color:var(--safe);background:color-mix(in srgb,var(--safe) 10%,var(--sheet))}
.opt.picked.bad{border-color:var(--alarm);background:color-mix(in srgb,var(--alarm) 10%,var(--sheet))}
.opt.picked.mid{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 12%,var(--sheet))}
.opt .why{display:block;font-size:.88rem;color:var(--muted);margin-top:6px}
.verdict{display:grid;gap:12px;justify-items:start}
.stamp{font-family:var(--display);font-size:2.4rem;line-height:1.2;border:4px solid currentColor;border-radius:10px;padding:2px 20px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
.stamp.fraud{color:var(--alarm)} .stamp.safe{color:var(--safe)}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}}
.lesson{background:var(--tint);border-radius:12px;padding:12px 14px;font-weight:500;border-inline-start:4px solid var(--signal)}
.lesson small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.result-line{font-weight:600}
.result-line.good{color:var(--safe)} .result-line.mid{color:var(--signal)} .result-line.bad{color:var(--alarm)}

/* toast */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 20px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* results */
.res{display:grid;gap:28px;padding-block:20px}
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:var(--shadow)}
.badge{width:150px;height:150px}
.res-hero h1{font-size:clamp(2.4rem,6vw,3.8rem)}
.bigscore{font-family:var(--display);font-size:1.6rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-family:var(--display);font-size:2.1rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.92rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.panel h3{font-size:1.45rem}
.review{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%}
.dot.good{background:var(--safe)} .dot.mid{background:var(--signal)} .dot.bad{background:var(--alarm)}
.review small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.golden{margin:0;padding-inline-start:1.3em;display:grid;gap:8px}
.golden li::marker{color:var(--signal);font-weight:700}

@media (max-width:860px){
  .hero,.case,.cols{grid-template-columns:1fr}
  .note{position:static}
  .hero-art{max-width:300px;order:-1}
}
@media (max-width:560px){
  .steps,.stats{grid-template-columns:1fr}
  .res-hero{grid-template-columns:1fr;justify-items:start}
  .badge{width:110px;height:110px}
  .hud .chip.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

/* ---------- device mockups: fixed colours, they stand in for real screenshots ---------- */
.device{font-family:"Readex Pro",Tahoma,sans-serif;color:#111;direction:rtl;text-align:start;user-select:none;-webkit-user-select:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.phone{width:min(340px,100%);background:#14171C;border-radius:40px;padding:11px;box-shadow:0 28px 50px -22px rgba(8,14,28,.6)}
.screen{background:#fff;border-radius:30px;overflow:hidden;min-height:540px;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:10px 24px 6px;font-size:12px;font-weight:700;direction:ltr;color:inherit}
.apphead{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid #E4E4E7;background:#F7F7F8}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:#B9C0CA;display:grid;place-items:center;color:#fff;font-weight:700}
.apphead b{display:block;font-size:14px;line-height:1.4}
.apphead small{display:block;color:#71717A;font-size:11px;line-height:1.4}
.thread{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.75}
.b{max-width:88%;padding:9px 12px;border-radius:16px;background:#E9E9EB;color:#111;align-self:flex-start}
.b.out{align-self:flex-end;background:#0A84FF;color:#fff}
.stamp-t{font-size:10.5px;color:#8A8A8E;text-align:center}
.lnk{color:#0A5FC2;text-decoration:underline;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.composer{margin:8px 12px 14px;border:1px solid #DDD;border-radius:20px;padding:7px 14px;color:#A1A1AA;font-size:13px}

.chat .screen{background:#ECE5DB}
.chat .apphead{background:#1D6B58;color:#fff;border:0}
.chat .apphead small{color:#CFE6DF}
.chat .b{background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.chat .b.out{background:#D8FBD0;color:#111}

.tg .screen{background:#DCE6EE}
.tg .apphead{background:#3B79C9;color:#fff;border:0}
.tg .apphead small{color:#D6E4F7}
.tg .b{background:#fff}

.call .screen{background:linear-gradient(170deg,#24344E,#0D1522);color:#fff}
.callhead{text-align:center;padding:22px 16px 12px;display:grid;gap:4px;justify-items:center}
.cav{width:72px;height:72px;border-radius:50%;background:#3E5373;display:grid;place-items:center;font-size:28px;font-weight:700;margin-bottom:6px}
.cid{display:block;font-size:19px;font-weight:600}
.cnum{display:block;font-size:13px;color:#A9B8CF;direction:ltr}
.ctime{font-size:12px;color:#7FE0A8;font-variant-numeric:tabular-nums}
.call .thread{gap:10px}
.call .b{background:rgba(255,255,255,.1);color:#EEF3FA;border:1px solid rgba(255,255,255,.12)}
.callbar{display:flex;justify-content:center;gap:26px;padding:12px 0 22px}
.callbar i{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.callbar i.end{background:#E5443B}

.social .apphead{background:#fff}
.post-img{margin:0;position:relative;aspect-ratio:1/1;max-width:100%;background:linear-gradient(145deg,#2C2A4A,#7A3E8F 55%,#E08B5A);display:grid;place-items:center;overflow:hidden}
.ph-ill{width:34%;aspect-ratio:9/19;border-radius:18px;background:linear-gradient(160deg,#C9CFD8,#6F7886);box-shadow:inset 0 0 0 5px #1B1D22,0 18px 30px rgba(0,0,0,.35)}
.pbadge{position:absolute;top:14px;right:14px;background:#FF3B30;color:#fff;font-weight:800;font-size:22px;padding:4px 12px;border-radius:10px;transform:rotate(6deg)}
.timer{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.6);color:#FFD166;font-weight:700;font-size:13px;padding:3px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.post-body{padding:10px 14px 14px;font-size:13.5px;line-height:1.75;display:grid;gap:6px}
.post-body .acts{font-size:12px;color:#555;font-weight:600}
.post-body .price{font-weight:700;font-size:15px}
.post-body .off{color:#999;text-decoration:line-through;font-weight:400}
.post-body .cmt{color:#8A8A8E;font-size:12px}

.win{width:100%;max-width:580px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #D3D9E1;box-shadow:0 28px 50px -24px rgba(8,14,28,.55)}
.winbar{display:flex;gap:7px;align-items:center;padding:9px 12px;background:#EDF0F4;border-bottom:1px solid #DCE1E8;font-size:12px;color:#555}
.winbar i{width:11px;height:11px;border-radius:50%;background:#D0D5DC;display:block}
.winbar span{margin-inline-start:8px}
.url{flex:1;margin-inline-start:8px;background:#fff;border:1px solid #D6DBE2;border-radius:999px;padding:3px 12px;font-size:12.5px;color:#333;text-align:left;direction:ltr;overflow-wrap:anywhere}
.insecure{color:#C5221F;font-weight:600}
.mail{padding:16px 20px 20px;font-size:14px;line-height:1.85;color:#1E1E1E;display:grid;gap:10px}
.mrow{font-size:13px;color:#444}
.mrow span{color:#888;display:inline-block;min-width:58px}
.mail hr{border:0;border-top:1px solid #EEE;margin:2px 0}
.attach{display:flex}
.file{display:inline-flex;gap:8px;align-items:center;border:1px solid #DDE1E6;border-radius:8px;padding:6px 12px;font-size:12.5px;background:#FAFAFB}
.file b{background:#7A5AF8;color:#fff;border-radius:4px;padding:0 6px;font-size:11px}
.sig{color:#777;font-size:13px}
.site{padding:20px clamp(14px,4vw,40px) 28px;display:grid;gap:12px;background:#F5F6F8}
.warnbar{background:#FDECEA;color:#9B1C17;border:1px solid #F5C2BE;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.logo{font-family:"Lalezar","Readex Pro",sans-serif;font-size:30px;color:#2A5BD7;text-align:center;line-height:1.3}
.form{background:#fff;border:1px solid #E1E4EA;border-radius:12px;padding:16px;display:grid;gap:9px;width:100%;max-width:360px;justify-self:center}
.fld{border:1px solid #CDD3DC;border-radius:8px;padding:8px 12px;font-size:13px;color:#8A8F98;background:#fff}
.fbtn{background:#2A5BD7;color:#fff;text-align:center;border-radius:8px;padding:9px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
document.documentElement.lang = "ar";
document.documentElement.dir = "rtl";

/* ---------------- content ---------------- */
const hs = (k, t) => `<span class="hs" data-flag="${k}">${t}</span>`;
const phone = (cls, head, body, foot = '<div class="composer">رسالة نصية</div>') =>
  `<div class="device phone ${cls}"><div class="screen"><div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>${head}<div class="thread">${body}</div>${foot}</div></div>`;
const head = (av, name, sub, bg = "") =>
  `<div class="apphead"><div class="av"${bg ? ` style="background:${bg}"` : ""}>${av}</div><div><b>${name}</b><small>${sub}</small></div></div>`;

const CASES = [
{
  title: "بطاقتك موقوفة؟", channel: "رسالة نصية", verdict: "fraud",
  ctx: "وصلتك هذه الرسالة الساعة 11 مساءً وأنت على وشك النوم.",

/* ---------------- state ---------------- */
let S = freshState();
function freshState(){ return { phase: "intro", i: 0, score: 0, found: [], falses: 0, hints: 0, choice: null, log: [] }; }

const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
};
let muted = store.get("ein-muted") === "1";

/* ---------------- sound ---------------- */
let actx = null;
function tone(freqs, type = "sine", dur = .12, gap = .09, vol = .14){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, n) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + n * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    });
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  found: () => tone([660, 990], "triangle"),
  wrong: () => tone([180, 140], "sawtooth", .14, .1, .06),
  stamp: () => tone([110], "square", .18, 0, .1),
  good: () => tone([523, 659, 784], "triangle", .16, .1),
  bad: () => tone([300, 220], "triangle", .2, .13)
};

function addScore(n){ S.score = Math.max(0, S.score + n); const el = $("#score"); if (el){ el.textContent = S.score; el.parentElement.classList.remove("score-pop"); void el.offsetWidth; el.parentElement.classList.add("score-pop"); } }
function floatAt(box, x, y, text, cls){
  const f = document.createElement("div"); f.className = "float " + cls; f.textContent = text;
  f.style.left = x + "px"; f.style.top = y + "px"; box.appendChild(f); setTimeout(() => f.remove(), 1000);
}

function renderCase(keep){
  const c = CASES[S.i], scanning = S.phase === "scan";
  const y = window.scrollY;
  app.innerHTML = `<div class="tape"></div><div class="wrap">${topbar()}${progress()}
    <section class="case">
      <div>
        <div class="ctx"><span class="tag"><i>${esc(c.channel)}</i> الحالة ${S.i + 1} من ${CASES.length}</span>

function noteBody(c){
  const total = Object.keys(c.flags).length;
  const keys = Object.keys(c.flags);
  const list = S.phase === "scan" ? S.found : keys;
  const items = list.map(k => {
    const n = keys.indexOf(k) + 1, miss = !S.found.includes(k);
    return `<li class="${miss ? "missed" : ""}"><span class="pin">${n}</span><div><b>${esc(c.flags[k][0])}${miss ? `<span class="lbl">فاتتك</span>` : ""}</b><small>${esc(c.flags[k][1])}</small></div></li>`;
  }).join("");

  if (S.phase === "scan") {
    return `<div class="note-head"><h3>دفتر المحقق</h3><span class="count">علامات مكتشفة: ${S.found.length}</span></div>
      ${items ? `<ul class="flags">${items}</ul>` : `<p class="empty">لم تسجّل أي علامة بعد. افحص الرسالة جيدًا: المرسل، الصياغة، الروابط، وما الذي يُطلب منك.</p>`}
      <div class="rule"></div>
      <div class="row"><button class="btn" id="done" type="button">انتهيت من الفحص</button>
      <button class="btn ghost" id="hint" type="button">تلميح (−${PTS.hint})</button></div>`;
  }

  const foundTxt = total ? `اكتشفت ${S.found.length} من ${total} علامات` : (S.falses ? `لا توجد علامات احتيال هنا، وسجّلت ${S.falses} إنذارات خاطئة` : `لا توجد علامات احتيال هنا، ولم تُطلق أي إنذار خاطئ. أحسنت.`);
  const opts = c.opts.map((o, n) => {
    let cls = "opt";
    if (S.choice !== null) { if (o[1] === "best") cls += " best"; if (n === S.choice) cls += " picked " + o[1]; }
    const why = S.choice !== null && (n === S.choice || o[1] === "best") ? `<span class="why">${esc(o[2])}</span>` : "";
    return `<button class="${cls}" data-o="${n}" type="button" ${S.choice !== null ? "disabled" : ""}>${esc(o[0])}${why}</button>`;
  }).join("");

  let verdict = "";
  if (S.phase === "feedback") {
    const q = c.opts[S.choice][1];
    const line = q === "best" ? ["good", `قرار صحيح. +${PTS.best}`] : q === "mid" ? ["mid", `قرار مقبول، لكن هناك أفضل منه. +${PTS.mid}`] : ["bad", "قرار خاطئ. هذا ما يريده المحتال."];
    const last = S.i === CASES.length - 1;
    verdict = `<div class="rule"></div><div class="verdict">
      <span class="stamp ${c.verdict}">${c.verdict === "fraud" ? "احتيال" : "رسالة سليمة"}</span>
      <p class="result-line ${line[0]}">${line[1]}</p>
      <div class="lesson"><small>القاعدة</small>${esc(c.lesson)}</div>
      <button class="btn signal" id="next" type="button">${last ? "اعرض نتيجتي" : "الحالة التالية"}</button></div>`;
  }

  return `<div class="note-head"><h3>${total ? "العلامات" : "نتيجة الفحص"}</h3><span class="count">${foundTxt}</span></div>
    ${items ? `<ul class="flags">${items}</ul>` : ""}
    <div class="rule"></div>
    <p class="q">ماذا ستفعل؟</p><div class="opts">${opts}</div>${verdict}`;
}

function bindNote(c){
  const done = $("#done"), hint = $("#hint"), next = $("#next");
  if (done) done.onclick = () => finishScan(c);
  if (hint) hint.onclick = () => useHint(c);
  if (next) next.onclick = nextCase;
  document.querySelectorAll(".opt[data-o]").forEach(b => b.onclick = () => choose(c, +b.dataset.o));
}

function paintFlags(c){
  const keys = Object.keys(c.flags);
  document.querySelectorAll("#ev .hs").forEach(el => {
    const k = el.dataset.flag, n = keys.indexOf(k) + 1;
    const first = el === document.querySelector(`#ev .hs[data-flag="${k}"]`);
    if (S.found.includes(k)) { el.classList.add("found"); if (first) el.dataset.n = n; }
    else if (S.phase !== "scan") { el.classList.add("missed"); if (first) el.dataset.n = n; }
  });
}

function onEvidence(e, c, ev){
  if (S.phase !== "scan" || !e.target.closest(".device")) return;
  const r = ev.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const h = e.target.closest(".hs");
  if (h) {
    const k = h.dataset.flag;
    if (S.found.includes(k)) return;
    S.found.push(k); addScore(PTS.flag); sfx.found();
    floatAt(ev, x, y, "+" + PTS.flag, "plus");
    paintFlags(c);
    $("#note").innerHTML = noteBody(c); bindNote(c);
  } else {
    S.falses++; addScore(-PTS.falseAlarm); sfx.wrong();
    const m = document.createElement("div"); m.className = "missx"; m.textContent = "✕";
    m.style.left = x + "px"; m.style.top = y + "px"; ev.appendChild(m); setTimeout(() => m.remove(), 1400);
    floatAt(ev, x, y - 18, "−" + PTS.falseAlarm, "minus");
    if (S.falses === 1) toast("هذا الجزء لا يبدو مريبًا. الضغط العشوائي يخصم نقاطًا.");
  }
}

function useHint(c){
  const left = Object.keys(c.flags).filter(k => !S.found.includes(k));
  if (!Object.keys(c.flags).length) { addScore(-PTS.hint); S.hints++; toast("تلميح: ليست كل حالة تحتوي على علامات احتيال. فكّر: هل كنت تتوقع هذه الرسالة؟"); return; }
  if (!left.length) { toast("وجدت كل العلامات في هذه الحالة. اضغط «انتهيت من الفحص»."); return; }
  addScore(-PTS.hint); S.hints++;
  const el = document.querySelector(`#ev .hs[data-flag="${left[0]}"]`);
  el.classList.remove("hint"); void el.offsetWidth; el.classList.add("hint");
  el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function finishScan(c){
  S.phase = "decide";
  if (c.verdict === "safe" && S.falses === 0) { addScore(PTS.cleanSafe); toast(`لم تُطلق أي إنذار خاطئ على رسالة سليمة. +${PTS.cleanSafe}`); }
  const total = Object.keys(c.flags).length;
  if (total && S.found.length < total) toast(`فاتتك ${total - S.found.length} علامات، وهي معلّمة الآن باللون الأحمر.`);
  render(true);
  if (window.innerWidth <= 860) $("#note").scrollIntoView({ behavior: "smooth", block: "start" });
}

function choose(c, n){
  if (S.choice !== null) return;
  S.choice = n; S.phase = "feedback";
  const q = c.opts[n][1];
  addScore(q === "best" ? PTS.best : q === "mid" ? PTS.mid : 0);
  S.log[S.i] = { q, found: S.found.length, total: Object.keys(c.flags).length, falses: S.falses };
  sfx.stamp(); setTimeout(q === "bad" ? sfx.bad : sfx.good, 180);
  $("#note").innerHTML = noteBody(c); bindNote(c);
  const p = document.querySelector(".progress"); if (p) p.outerHTML = progress();
  const nx = $("#next"); if (nx) nx.focus({ preventScroll: true });
}

function nextCase(){
  if (S.i === CASES.length - 1) {
    S.phase = "results";
    const best = +store.get("ein-best") || 0;
    if (S.score > best) store.set("ein-best", String(S.score));
  } else {
    S.i++; S.phase = "scan"; S.found = []; S.falses = 0; S.choice = null;
  }
  render(); window.scrollTo({ top: 0 });
}

function rankFor(p){
  if (p >= .85) return ["درع ضد الاحتيال", "عينك لا تفوتها خدعة. شارك هذه اللعبة مع من تحب، فهم الأكثر حاجة إليها.", "#167F57"];
  if (p >= .65) return ["محقق متمرّس", "تكشف أغلب الحيل. راجع العلامات التي فاتتك لتصل إلى القمة.", "#E9A514"];
  if (p >= .4) return ["محقق ناشئ", "بداية جيدة. بعض الحيل نجحت معك، وهذا طبيعي. العب مرة أخرى بعد قراءة القواعد.", "#E9A514"];
  return ["متدرّب", "المحتالون يعتمدون على السرعة والخوف. اقرأ القواعد الذهبية أدناه ثم أعد المحاولة.", "#C93A33"];
}

function renderResults(){
  const p = S.score / MAX, [rank, msg, col] = rankFor(p);
  const flagsTotal = S.log.reduce((s, l) => s + l.total, 0), flagsFound = S.log.reduce((s, l) => s + l.found, 0);
  const goodDec = S.log.filter(l => l.q === "best").length, falses = S.log.reduce((s, l) => s + l.falses, 0);
  const deg = Math.round(p * 360);
  app.innerHTML = `<div class="tape"></div><div class="wrap">${topbar()}${progress()}
    <section class="res">
      <div class="res-hero">
        <svg class="badge" viewBox="0 0 150 150" aria-hidden="true">
          <circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="75" cy="75" r="64" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(deg / 360 * 402).toFixed(1)} 402" transform="rotate(-90 75 75)"/>
          <text x="75" y="86" text-anchor="middle" font-family="Lalezar, sans-serif" font-size="36" fill="var(--ink)">${Math.round(p * 100)}%</text>
        </svg>
        <div><p class="eyebrow">رتبتك</p><h1>${rank}</h1><p class="bigscore">${S.score} من ${MAX} نقطة</p><p class="lead">${msg}</p></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${flagsFound}/${flagsTotal}</b><span>علامات احتيال اكتشفتها</span></div>
        <div class="stat"><b>${goodDec}/${CASES.length}</b><span>قرارات صحيحة تمامًا</span></div>
        <div class="stat"><b>${falses}</b><span>إنذارات خاطئة</span></div>
      </div>
      <div class="cols">
        <div class="panel"><h3>سجل القضايا</h3><ul class="review">${CASES.map((c, n) => {
          const l = S.log[n]; return `<li><span class="dot ${gradeOf(l.q)}"></span><span>${esc(c.title)}</span><small>${l.total ? `${l.found}/${l.total} علامات` : "رسالة سليمة"}</small></li>`;
        }).join("")}</ul></div>
        <div class="panel"><h3>القواعد الذهبية</h3><ol class="golden">${GOLDEN.map(g => `<li>${esc(g)}</li>`).join("")}</ol></div>
      </div>
      <div class="row"><button class="btn signal big" id="again" type="button">العب مرة أخرى</button>
      <button class="btn ghost" id="toIntro" type="button">الشاشة الرئيسية</button></div>
    </section></div>`;
  bindTop();
  $("#again").onclick = () => { S = freshState(); S.phase = "scan"; render(); window.scrollTo({ top: 0 }); };
  $("#toIntro").onclick = () => { S = freshState(); render(); };
  tone([523, 659, 784, 1046], "triangle", .2, .12);
}

/* ---------------- boot ---------------- */
function start(data){
  if (data && data.S && typeof data.S.i === "number" && data.S.i < CASES.length) S = Object.assign(freshState(), data.S);
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
